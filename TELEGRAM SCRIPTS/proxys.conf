# Relays SOCKS5 de Mullvad por los que entra el SSH de administracion.
# Un nombre por linea. Los usa proxy-watch.sh para preguntarle a la API de
# Mullvad si siguen activos.
#
# ESTE FICHERO DEL REPOSITORIO ES SOLO UN EJEMPLO. El de produccion, en
# /opt/dirtyland/monitor/proxys.conf, NO se copia de aqui: se GENERA a partir
# del ~/.ssh/config del equipo (apartado 3.4.4), leyendo los relays de sus
# lineas ProxyCommand. Asi la lista que se vigila y la que se usa para entrar
# no pueden quedar distintas.
#
# Los tres de abajo son los del ejemplo de la guia; sirven de referencia y son
# los que usan los tests para comprobar que las banderas salen de aqui.

ch-zrh-wg-socks5-002.relays.mullvad.net
se-got-wg-socks5-001.relays.mullvad.net
nl-ams-wg-socks5-001.relays.mullvad.net
